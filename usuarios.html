<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD JavaScript</title>
</head>
<body>

<h2>CRUD Usuários</h2>

<form id="form">
    <input type="hidden" id="id" value="">
    <input type="text" id="nome" placeholder="Nome" required>
    <input id="email" type="email" placeholder="Email" required>
    <button id="botaoSalvar" type="submit">Salvar</button>
</form>
<br/><br/>
<button id="limparMemoria" type="button" onclick="limparMemoria()">Limpar memória</button>
<br/><br/>
<h3>Lista de Usuários</h3>
<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Ações</th>
        </tr>
    </thead>
    <tbody id="userList">
    </tbody>
</table>

<script>
    const STORAGE_KEY = 'usuariosCrud';

    // Carrega usuários do localStorage ou inicia vazio
    function carregarUsuarios() {
        const dados = localStorage.getItem(STORAGE_KEY);
        if (dados) {
            try {
                return JSON.parse(dados);
            } catch (e) {
                //console.error('Erro ao ler dados do localStorage, iniciando vazio.', e);
                return [];
            }
        }
        return [];
    }

    function salvarUsuarios() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(usuarios));
    }

    let usuarios = carregarUsuarios();

    // Calcula o próximo ID com base no que já existe
    let nextId = usuarios.length
        ? Math.max(...usuarios.map(u => u.id)) + 1
        : 1;

    const form = document.getElementById('form');
    const nome = document.getElementById('nome');
    const email = document.getElementById('email');
    const idInput = document.getElementById('id');

    function renderUsuarios() {
        const userList = document.getElementById('userList');
        userList.innerHTML = '';

        usuarios.forEach(usuario => {
            userList.innerHTML += `
                <tr>
                    <td>${usuario.id}</td>
                    <td>${usuario.nome}</td>
                    <td>${usuario.email}</td>
                    <td>
                        <button onclick="editar(${usuario.id})">Editar</button>
                        <button onclick="excluir(${usuario.id})">Excluir</button>
                    </td>
                </tr>
            `;
        });
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const usuarioId = idInput.value;

        if (usuarioId) {
            usuarios = usuarios.map(user =>
                user.id == usuarioId
                    ? { id: parseInt(usuarioId), nome: nome.value, email: email.value }
                    : user
            );
        } else {
            usuarios.push({ id: nextId++, nome: nome.value, email: email.value });
        }

        salvarUsuarios();

        form.reset();
        idInput.value = '';

        //alert("Cadastrado com sucesso!");
        renderUsuarios();

    });

    function editar(id) {
        const usuario = usuarios.find(user => user.id === id);
        if (!usuario) return;
        nome.value = usuario.nome;
        email.value = usuario.email;
        idInput.value = usuario.id;
    }

    function excluir(id) {
        usuarios = usuarios.filter(user => user.id !== id);
        salvarUsuarios();
        renderUsuarios();
    }

    function limparMemoria() {
        if (confirm('Tem certeza que deseja apagar todos os usuários da memória?')) {
            usuarios = [];
            nextId = 1;
            salvarUsuarios();
            renderUsuarios();
        }
    }

    renderUsuarios();
</script>

</body>
</html>
